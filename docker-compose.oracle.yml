services:
  # 코브라우징 서버 (Playwright/Chromium) — Oracle Cloud에서만 실행
  server-browser:
    build:
      context: .
      dockerfile: server/Dockerfile.browser
    container_name: pulluprn-browser
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # TURN 서버 (coturn)
  coturn:
    image: coturn/coturn:latest
    container_name: coturn-server
    restart: always
    network_mode: "host"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --lt-cred-mech
      - --realm=pulluprn
      - "--user=${TURN_USER}:${TURN_PASSWORD}"
      - "--external-ip=144.24.87.178/10.0.0.198"
