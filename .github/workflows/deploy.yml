name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행도 가능하도록

jobs:
  # ─────────────────────────────────────────────
  # 1. EC2 배포 (client, chat, video, db)
  # ─────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            echo "🚀 EC2 배포 시작..."

            PROJECT_PATH="${{ secrets.EC2_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH=$(find ~ /home -name "pulluprn" -type d 2>/dev/null | head -1)
            fi

            if [ -z "$PROJECT_PATH" ] || [ ! -d "$PROJECT_PATH" ]; then
              echo "❌ 프로젝트 경로를 찾을 수 없습니다"
              exit 1
            fi

            echo "📁 경로: $PROJECT_PATH"
            cd "$PROJECT_PATH"

            echo "📥 Git pull..."
            git fetch origin
            git reset --hard origin/main

            if docker compose version &>/dev/null; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi

            echo "🔄 재시작..."
            $DOCKER_COMPOSE -f docker-compose.ec2.yml down
            $DOCKER_COMPOSE -f docker-compose.ec2.yml build --no-cache
            $DOCKER_COMPOSE -f docker-compose.ec2.yml up -d

            echo "✅ EC2 배포 완료!"
            $DOCKER_COMPOSE -f docker-compose.ec2.yml ps

  # ─────────────────────────────────────────────
  # 2. Oracle 배포 (server-browser, coturn)
  # ─────────────────────────────────────────────
  deploy-oracle:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Oracle and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Oracle 배포 시작..."

            cd ~/pulluprn

            echo "📥 Git pull..."
            git fetch origin
            git reset --hard origin/main

            echo "🔄 재시작..."
            docker compose -f docker-compose.oracle.yml --env-file .env down
            docker compose -f docker-compose.oracle.yml --env-file .env build --no-cache server-browser
            docker compose -f docker-compose.oracle.yml --env-file .env up -d

            echo "✅ Oracle 배포 완료!"
            docker compose -f docker-compose.oracle.yml ps
